server:
    port: 8080

spring:
    application:
        name: deploy-platform
    main:
        allow-bean-definition-overriding: true
    datasource:
        url: jdbc:h2:file:./data/deploy;AUTO_SERVER=TRUE
        driver-class-name: org.h2.Driver
        username: sa
        password: ''
    sql:
        init:
            mode: always
            schema-locations: classpath:schema.sql
    h2:
        console:
            enabled: true
            path: /h2-console

mybatis-plus:
    configuration:
        map-underscore-to-camel-case: true

# 平台运行期目录（制品/日志等，运行时自动创建，均已 gitignore）
deploy:
    storage-dir: ./storage      # 制品库根目录: storage/{project}/{version}/
    log-dir: ./logs             # 构建日志: logs/{releaseId}/build.log
    auth:
        token: ''              # 平台令牌：空 = 认证关闭（零鉴权兼容模式，保持既有 curl 用法）；配置后 /api/** 需会话
        session-ttl: 12h       # 登录会话有效期
    winsw:
        exe-path: F:/workspace/deploy/vendor/winsw/WinSW-x64.exe  # 平台侧 WinSW（仓库根 vendor/，绝对路径避免 cwd 歧义）
    build:
        timeout-millis: 600000    # 单次构建超时（10 分钟），超时强杀子进程并落 FAILED
        concurrency: 2            # 构建并发线程数（任务 3.4）
        queue-capacity: 50        # 等待队列容量：超并发任务排队不失败

# 插件系统（plugin-system change）：jar 放入目录 → 重启加载；disabled 子目录内 jar 不加载
plugins:
    dir: ./plugins                # 插件目录（相对工作目录或绝对路径），不存在时正常启动
    disabled-subdir: disabled     # 禁用子目录：jar 移入后下次启动排除
