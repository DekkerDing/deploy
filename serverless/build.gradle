plugins {
    id 'org.springframework.boot' version '2.6.14'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
}

group = 'io.github.DekkerDing'
version = '1.0-SNAPSHOT'
sourceCompatibility = '1.8'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    gradlePluginPortal()
    maven { url 'https://repo.springsource.org/plugins-release' }
    maven { url 'https://repo.spring.io/plugins-release-local' }
    maven { url "https://repo.spring.io/plugins-release" }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/goole' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven { url 'https://repo.spring.io/libs-snapshot' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url "https://repo.spring.io/libs-spring-framework-build" }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url 'https://repo.spring.io/plugins-snapshot' }
    maven { url 'https://plugins.gradle.org/m2/' }
    mavenCentral()
}

javadoc {
    afterEvaluate {
        configure(options) {
            encoding "UTF-8"
            charSet 'UTF-8'
            author true
            version true
            failOnError false
            links "http://docs.oracle.com/javase/8/docs/api"
        }
    }
}

//idea {
//    project {
//        jdkName = "1.8"
//        languageLevel = "1.8"
//        vcs = "Git"
//    }
//}

dependencies {
    //implementation 'org.springframework.boot:spring-boot-starter-actuator'
    //implementation 'org.springframework.boot:spring-boot-starter-batch'
    // implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // https://mvnrepository.com/artifact/io.fabric8/kubernetes-client
    implementation 'io.fabric8:kubernetes-client:6.13.3'

    // https://mvnrepository.com/artifact/com.github.docker-java/docker-java
    implementation 'com.github.docker-java:docker-java:3.4.0'

// https://mvnrepository.com/artifact/org.springframework.cloud/spring-cloud-function-context
    //implementation 'org.springframework.cloud:spring-cloud-function-context:4.1.2'

    compileOnly 'org.projectlombok:lombok'
    //developmentOnly 'org.springframework.boot:spring-boot-devtools'
    //runtimeOnly 'com.mysql:mysql-connector-j'
    //runtimeOnly 'com.taobao.arthas:arthas-spring-boot-starter:3.6.7'
    //annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

dependencyManagement{
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:2.6.14'
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2021.0.5'
        mavenBom 'com.alibaba.cloud:spring-cloud-alibaba-dependencies:2021.1'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
